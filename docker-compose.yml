services:
  postgres:
    image: postgres:17-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db-migrate:
    image: postgres:17-alpine
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_DBNAME: ${POSTGRES_DB}
    volumes:
      - ./services/backend-api/database:/db
    command: >
      sh -c "cd /db && bash migrate.sh run"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend-api:
    build:
      context: ./services/backend-api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      HOME: /tmp
      NEURATRADE_HOME: /tmp/neuratrade
      DATABASE_DRIVER: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_DBNAME: ${POSTGRES_DB}
      DATABASE_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TELEGRAM_SERVICE_URL: http://telegram-service:3002
      TELEGRAM_GRPC_ADDRESS: telegram-service:50052
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  telegram-service:
    build:
      context: ./services/telegram-service
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
      - "50052:50052"
    env_file:
      - .env
    environment:
      HOME: /tmp
      NEURATRADE_HOME: /tmp/neuratrade
      BACKEND_API_URL: http://backend-api:8080
      TELEGRAM_API_BASE_URL: http://backend-api:8080
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      GRPC_BIND_ADDR: 0.0.0.0
    depends_on:
      backend-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
