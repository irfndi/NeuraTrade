services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: neuratrade
      POSTGRES_PASSWORD: neuratrade
      POSTGRES_DB: neuratrade
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuratrade -d neuratrade"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-api:
    build:
      context: ./services/backend-api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://neuratrade:neuratrade@postgres:5432/neuratrade?sslmode=disable
      REDIS_ADDR: redis:6379
      TELEGRAM_SERVICE_URL: http://telegram-service:3002
      CCXT_SERVICE_URL: http://ccxt-service:3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  telegram-service:
    build:
      context: ./services/telegram-service
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      BACKEND_API_URL: http://backend-api:8080
    depends_on:
      backend-api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
