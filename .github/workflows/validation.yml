name: Validation

on:
  push:
    branches: [main, develop, development]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main, develop, development]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.0"
  BUN_VERSION: "1.3.9"

jobs:
  backend-quality:
    name: Backend Quality (fmt/lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: services/backend-api/go.sum

      - name: Install dependencies
        run: make mod-download

      - name: Check formatting
        run: make fmt-check

      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(pwd)/bin v2.10.1

      - name: Run Go lint
        run: cd services/backend-api && ../../bin/golangci-lint run

  frontend-quality:
    name: Frontend Quality (telegram-service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            services/telegram-service/node_modules
          key: ${{ runner.os }}-bun-telegram-${{ hashFiles('services/telegram-service/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-telegram-

      - name: Install dependencies
        run: cd services/telegram-service && bun install --frozen-lockfile

      - name: Check formatting
        run: cd services/telegram-service && bunx prettier --check .

      - name: Run lint
        run: cd services/telegram-service && bunx oxlint .

      - name: Run typecheck
        run: cd services/telegram-service && bunx tsc --noEmit

  backend-tests:
    name: Backend Tests (native/sqlite)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_DRIVER: sqlite
      SQLITE_PATH: /tmp/neuratrade-ci.db
      SQLITE_DB_PATH: /tmp/neuratrade-ci.db
      NEURATRADE_HOME: /tmp/neuratrade-ci-home
      ADMIN_API_KEY: ""
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: services/backend-api/go.sum

      - name: Install dependencies
        run: make mod-download

      - name: Run unit tests
        run: cd services/backend-api && go test -v -race -timeout=15m ./cmd/... ./internal/... ./pkg/...

      - name: Run integration tests
        run: cd services/backend-api && go test -v -timeout=8m ./test/integration/...

      - name: Run e2e tests
        run: cd services/backend-api && go test -v -timeout=8m ./test/e2e/...

      - name: Run coverage check
        run: STRICT=true make coverage-check

  frontend-tests:
    name: Frontend Tests (telegram-service)
    runs-on: ubuntu-latest
    env:
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY || 'test-admin-api-key-for-ci' }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET || 'test-webhook-secret-for-ci' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            services/telegram-service/node_modules
          key: ${{ runner.os }}-bun-telegram-tests-${{ hashFiles('services/telegram-service/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-telegram-tests-

      - name: Install dependencies
        run: cd services/telegram-service && bun install --frozen-lockfile

      - name: Run tests
        run: cd services/telegram-service && bun test

  backend-security:
    name: Backend Security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: services/backend-api/go.sum

      - name: Install dependencies
        run: make mod-download

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install security tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run static security scan (gosec)
        # TODO(security:G117,target=2026-04-15): remove exclusion after validating http server timeout handling patterns.
        # TODO(security:G704,target=2026-04-15): remove exclusion after replacing deferred recover/error handling patterns.
        # TODO(security:G404,target=2026-04-15): remove exclusion after replacing weak-rand usage in non-test paths.
        # TODO(security:G118,target=2026-04-15): remove exclusion after context-lifecycle remediation backlog is complete.
        run: cd services/backend-api && gosec -severity medium -confidence medium -exclude=G117,G704,G404,G118 ./...

      - name: Run vulnerability scan (govulncheck)
        run: cd services/backend-api && govulncheck ./...

      - name: Run vulnerability scan (trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: services/backend-api
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          version: v0.69.2

  frontend-security:
    name: Frontend Security (telegram-service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: cd services/telegram-service && bun install --frozen-lockfile

      - name: Run dependency audit
        run: cd services/telegram-service && bun audit
