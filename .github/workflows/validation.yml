name: Validation

on:
  push:
    branches: [main, develop, development]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main, develop, development]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  # Event names must not collapse into one group: back-to-back pushes to the
  # same branch would otherwise cancel the first push's in-flight run.
  group: validation-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.2"

jobs:
  frontend-quality:
    name: Frontend Quality (Bun services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Telegram Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.3
        with:
          path: |
            ~/.bun/install/cache
            services/telegram-service/node_modules
          key: ${{ runner.os }}-bun-telegram-${{ hashFiles('services/telegram-service/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-telegram-

      - name: Install Telegram dependencies
        run: cd services/telegram-service && bun install --frozen-lockfile

      - name: Check Telegram formatting
        # Pinned (matches autofix's oxfmt@0.62.0): an unpinned formatter track
        # reformats churn across PRs as the tool updates.
        run: cd services/telegram-service && bunx oxfmt@0.62.0 --check .

      - name: Run Telegram lint
        run: cd services/telegram-service && bunx oxlint .

      - name: Run Telegram build
        run: cd services/telegram-service && bun run build

      - name: Cache TypeScript CLI Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.3
        with:
          path: |
            ~/.bun/install/cache
            services/neuratrade-cli-ts/node_modules
          key: ${{ runner.os }}-bun-cli-ts-${{ hashFiles('services/neuratrade-cli-ts/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cli-ts-

      - name: Install TypeScript CLI dependencies
        run: cd services/neuratrade-cli-ts && bun install --frozen-lockfile

      - name: Check TypeScript CLI formatting
        # Pinned (matches autofix's oxfmt@0.62.0): an unpinned formatter track
        # reformats churn across PRs as the tool updates.
        run: cd services/neuratrade-cli-ts && bunx oxfmt@0.62.0 --check .

      - name: Run TypeScript CLI lint
        run: cd services/neuratrade-cli-ts && bunx oxlint .

      - name: Run TypeScript CLI typecheck
        run: cd services/neuratrade-cli-ts && bunx tsc --noEmit

      - name: Build TypeScript CLI
        run: cd services/neuratrade-cli-ts && bun build index.ts --compile --outfile ../../bin/neuratrade-ts

  frontend-tests:
    name: Frontend Tests (Bun services)
    runs-on: ubuntu-latest
    env:
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Telegram Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.3
        with:
          path: |
            ~/.bun/install/cache
            services/telegram-service/node_modules
          key: ${{ runner.os }}-bun-telegram-tests-${{ hashFiles('services/telegram-service/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-telegram-tests-

      - name: Install Telegram dependencies
        run: cd services/telegram-service && bun install --frozen-lockfile

      - name: Prepare Telegram test credentials
        run: |
          admin_api_key="${ADMIN_API_KEY:-}"
          webhook_secret="${TELEGRAM_WEBHOOK_SECRET:-}"

          if [[ -z "$admin_api_key" ]]; then
            admin_api_key="ci-admin-$(openssl rand -hex 32)"
            echo "::notice::ADMIN_API_KEY secret is not configured; generated an ephemeral CI-only value."
          fi

          if [[ -z "$webhook_secret" ]]; then
            webhook_secret="ci-webhook-$(openssl rand -hex 32)"
            echo "::notice::TELEGRAM_WEBHOOK_SECRET secret is not configured; generated an ephemeral CI-only value."
          fi

          echo "::add-mask::$admin_api_key"
          echo "::add-mask::$webhook_secret"
          # Random per-run delimiters so secret values containing a fixed
          # delimiter can never terminate the heredoc early.
          admin_delim="ADMIN_API_KEY_$(openssl rand -hex 16)"
          webhook_delim="TELEGRAM_WEBHOOK_SECRET_$(openssl rand -hex 16)"
          {
            echo "ADMIN_API_KEY<<$admin_delim"
            echo "$admin_api_key"
            echo "$admin_delim"
            echo "TELEGRAM_WEBHOOK_SECRET<<$webhook_delim"
            echo "$webhook_secret"
            echo "$webhook_delim"
          } >> "$GITHUB_ENV"

      - name: Run Telegram tests
        run: cd services/telegram-service && bun test

      - name: Cache TypeScript CLI Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.3
        with:
          path: |
            ~/.bun/install/cache
            services/neuratrade-cli-ts/node_modules
          key: ${{ runner.os }}-bun-cli-ts-tests-${{ hashFiles('services/neuratrade-cli-ts/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cli-ts-tests-

      - name: Install TypeScript CLI dependencies
        run: cd services/neuratrade-cli-ts && bun install --frozen-lockfile

      - name: Run TypeScript CLI tests
        run: cd services/neuratrade-cli-ts && bun test

  frontend-security:
    name: Frontend Security (Bun services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Set up Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Telegram dependencies
        run: cd services/telegram-service && bun install --frozen-lockfile

      - name: Run Telegram dependency audit
        run: cd services/telegram-service && bun audit

      - name: Cache TypeScript CLI Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.3
        with:
          path: |
            ~/.bun/install/cache
            services/neuratrade-cli-ts/node_modules
          key: ${{ runner.os }}-bun-cli-ts-audit-${{ hashFiles('services/neuratrade-cli-ts/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cli-ts-audit-

      - name: Install TypeScript CLI dependencies
        run: cd services/neuratrade-cli-ts && bun install --frozen-lockfile

      - name: Run CLI dependency audit
        run: cd services/neuratrade-cli-ts && bun audit

      - name: Gate CLI audit on high/critical
        run: |
          # Preserve bun's exit status: an audit crash (network error, bun
          # bug) must not fall through to an empty report that reads as a
          # passing gate.
          cd services/neuratrade-cli-ts
          if ! bun audit --json > /tmp/cli-audit.json; then
            echo "bun audit --json failed (exit $?); reports must not be assumed empty" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json, sys

          UNKNOWN_SHAPE = 2  # distinct from findings (1) so shape drift stands out

          try:
              data = json.load(open("/tmp/cli-audit.json"))
          except (json.JSONDecodeError, OSError) as err:
              print(f"audit JSON unreadable: {err}", file=sys.stderr)
              sys.exit(UNKNOWN_SHAPE)

          def advisory_pairs(obj):
              """Return [(package, advisory)] for known bun audit shapes, else None."""
              if isinstance(obj, dict) and isinstance(obj.get("vulnerabilities"), dict):
                  obj = obj["vulnerabilities"]
              if not isinstance(obj, dict) or not obj:
                  return None
              out = []
              for pkg, val in obj.items():
                  if not isinstance(val, (dict, list)):
                      return None
                  for adv in val if isinstance(val, list) else [val]:
                      if not isinstance(adv, dict) or "severity" not in adv:
                          return None
                      out.append((pkg, adv))
              return out

          pairs = advisory_pairs(data)
          if pairs is None:
              print(
                  "unexpected bun audit --json shape: expected a map of "
                  "package -> advisory (or list of advisories, or wrapped in "
                  "{'vulnerabilities': {...}}), each advisory with a "
                  "'severity' key; got " + type(data).__name__ + ". Update this "
                  "gate for the new shape before trusting its result.",
                  file=sys.stderr,
              )
              sys.exit(UNKNOWN_SHAPE)

          bad = [
              (pkg, a["severity"], a.get("url"))
              for pkg, a in pairs
              if a["severity"] in ("high", "critical")
          ]
          print("high/critical findings:", bad if bad else "none")
          sys.exit(1 if bad else 0)
          PY
