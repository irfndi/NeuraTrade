# Lightweight native smoke tests for operational scripts that do not need
# external exchange credentials or long-running backend services.
name: Lightweight Native Tests
permissions:
  contents: read
on: push
jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Run script tests
        run: make test-scripts
