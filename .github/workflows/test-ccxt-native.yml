# Lightweight native smoke tests for the Bun services. They need no
# external exchange credentials or long-running backend services.
name: Lightweight Native Tests
permissions:
  contents: read
on: push
jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Set up Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2
        with:
          # Same pin as validation.yml so this push-triggered workflow exercises
          # the identical runtime the suites are validated against.
          bun-version: "1.4.2"
      # A fresh checkout has no node_modules: every test importing the CLI's
      # src (e.g. growth-sizing-sweep -> grid-universe.ts -> `effect`) died
      # in ~8s with "Cannot find package 'effect'" — red on every push since
      # the install step was never here. Frozen lockfile keeps CI honest.
      - name: Install TS deps
        run: |
          set -euo pipefail
          # Explicit subshell cds (no ../ relay): each install runs in a known
          # directory regardless of any earlier cd's exit status.
          (cd services/neuratrade-cli-ts && bun install --frozen-lockfile)
          (cd services/telegram-service && bun install --frozen-lockfile)
      - name: Run native tests
        run: make test
