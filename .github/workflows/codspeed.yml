name: CodSpeed

on:
  push:
    branches:
      - main
      - develop
      - development
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codspeed:
    name: Run benchmarks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.3.0
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: services/backend-api/go.sum

      - name: Install dependencies
        run: go mod download

      - name: Run benchmarks and upload to CodSpeed
        uses: CodSpeedHQ/action@963d9972d68502bffab879730b8d1d7233c9c118 # v2
        with:
          run: >
            go test -bench=. -run=^$
            ./test/benchmark/
            ./internal/crypto/
            ./internal/utils/
            ./internal/database/
          token: ${{ secrets.CODSPEED_TOKEN }}
