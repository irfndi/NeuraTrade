name: Autofix

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Cancel superseded runs so two autofix jobs never race to commit/push
# the same PR branch.
concurrency:
  group: autofix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  autofix:
    name: Auto-fix code issues
    runs-on: ubuntu-latest
    # workflow_dispatch runs manually (no PR context); otherwise only
    # autofix PRs from this repository, never forks.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2
        with:
          bun-version: "1.4.2"

      - name: Install Bun dependencies
        run: |
          if [ -d "services/telegram-service" ]; then
            cd services/telegram-service && bun install
          fi

      - name: Install shfmt (pinned release asset)
        env:
          SHFMT_VERSION: "3.14.1"
          SHFMT_SHA256: "76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf"
        run: |
          # The format step used to call shfmt that nothing installed, so it
          # silently no-opped on every run. Pin the binary and verify it.
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64" \
            -o /tmp/shfmt
          echo "${SHFMT_SHA256}  /tmp/shfmt" | sha256sum -c -
          install -m 0755 /tmp/shfmt "$HOME/.local/bin/shfmt"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run TypeScript/JS formatters
        run: |
          if [ -d "services/telegram-service" ]; then
            cd services/telegram-service
            # oxfmt failing is a broken formatter, not a finding: fail the job.
            bunx oxfmt@0.62.0
            # Pinned to match package.json's oxlint version; `|| echo` stays
            # because unfixable findings are noise for a format job, not a
            # reason to fail it.
            bunx oxlint@1.89.0 --fix . || echo "::warning::oxlint --fix reported findings (non-fatal)"
          fi

      - name: Format shell scripts
        run: |
          # Scope matches the git-auto-commit file_pattern (services/**, scripts/**,
          # docs/**) so formatted files are actually committed.
          # Exclude .github/workflows to avoid permission issues.
          # A non-zero shfmt means a script failed to parse: fail, don't shrug.
          find services scripts docs -name "*.sh" \
            -not -path "*/node_modules/*" \
            -not -path "*/bin/*" \
            -not -path "*/build/*" \
            -exec shfmt -w -i 2 -ci -bn {} +

      - name: Restore workflow files
        run: |
          # Restore any changes to .github/workflows/ since GitHub Apps cannot modify them
          git checkout -- .github/workflows/ 2>/dev/null || true

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: "chore: autofix code formatting and linting"
          commit_user_name: "autofix-ci[bot]"
          commit_user_email: "autofix-ci[bot]@users.noreply.github.com"
          commit_author: "autofix-ci[bot] <autofix-ci[bot]@users.noreply.github.com>"
          file_pattern: "services/** scripts/** protos/** docs/**"
