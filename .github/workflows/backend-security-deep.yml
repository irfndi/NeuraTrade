name: Backend Security Deep

on:
  push:
    branches: [main, develop, development]
    paths:
      - "services/backend-api/**"
      - ".github/workflows/backend-security-deep.yml"
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  GO_VERSION: "1.26.5"

jobs:
  backend-security-deep:
    name: Backend Security Deep (gosec taint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: services/backend-api/go.sum

      - name: Install dependencies
        run: make mod-download

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.24.7

      - name: Run deep taint scan (gosec)
        # TODO(security:taint,target=2026-05-15): restore the monolithic internal/services package after decomposition removes the current taint-analysis blow-up.
        run: |
          set -euo pipefail
          cd services/backend-api
          # Fail loudly on `go list` errors instead of silently scanning zero packages.
          if ! go list -f '{{.Dir}}' ./internal/services/... > /tmp/deep_pkgs 2>&1; then
            echo "go list failed; aborting deep taint scan" >&2
            exit 1
          fi
          mapfile -t deep_packages < <(grep -v '/internal/services$' /tmp/deep_pkgs)

          if [ "${#deep_packages[@]}" -eq 0 ]; then
            echo "No decomposed internal/services subpackages available for bounded taint scan"
            exit 0
          fi

          gosec \
            -severity medium \
            -confidence medium \
            -exclude=G117,G704,G404,G118 \
            -exclude-generated \
            -exclude-dir=internal/testutil \
            -exclude-dir=internal/api/handlers/testmocks \
            -exclude-dir=pkg/pb \
            -fmt sarif \
            -out deep-gosec.sarif \
            "${deep_packages[@]}"

      - name: Upload SARIF report
        if: always() && hashFiles('deep-gosec.sarif') != ''
        uses: github/codeql-action/upload-sarif@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e # v3
        with:
          sarif_file: deep-gosec.sarif
