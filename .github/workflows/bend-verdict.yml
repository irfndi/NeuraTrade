name: Bend verdict

# The proof gate `bend PROOF.bend` runs on every Native build. This is the
# SECOND check, with the Lean kernel: it is the only one that establishes
# mathematical validity rather than checker acceptance, and it costs a Lean
# toolchain (~1.5 GB), so it runs weekly and on demand instead of per PR.
#
# Kept out of native.yml so the per-PR path filters and `needs` graph stay
# untouched; the gate text is identical (`bend PROOF.bend --verdict`).

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bend-verdict-${{ github.ref }}
  cancel-in-progress: true

env:
  BEND_VERSION: "2.0.37"
  # The kernel BendTT builds against; must match what `bend --verdict` expects.
  LEAN_VERSION: "leanprover/lean4:v4.34.0"

jobs:
  verdict:
    name: Lean kernel recheck (bend PROOF.bend --verdict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Bend (pinned ${{ env.BEND_VERSION }} release asset)
        env:
          BEND_NO_TELEMETRY: "1"
        run: |
          # Same pinned-asset rule as native.yml: never pipe install.sh, which
          # tracks whatever upstream published today.
          set -o pipefail
          VER="${{ env.BEND_VERSION }}"
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) asset="bend-${VER}-linux-x64.tar.gz" ;;
            Linux-arm64|Linux-aarch64) asset="bend-${VER}-linux-arm64.tar.gz" ;;
            Darwin-arm64) asset="bend-${VER}-darwin-arm64.tar.gz" ;;
            Darwin-x86_64) asset="bend-${VER}-darwin-x64.tar.gz" ;;
            *) echo "unsupported runner arch $(uname -s)-$(uname -m)" >&2; exit 1 ;;
          esac
          url="https://github.com/bendlang/bend/releases/download/v${VER}/${asset}"
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 "$url" -o "/tmp/${asset}"; then break; fi
            echo "bend download attempt $attempt failed: $url" >&2
            [ "$attempt" = 3 ] && exit 1
            sleep $((attempt * 10))
          done
          mkdir -p "$HOME/.bend"
          tar -xzf "/tmp/${asset}" -C "$HOME/.bend"
          echo "$HOME/.bend/bend/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.bend/bend/bin:$PATH"
          test "$(bend version)" = "bend ${VER}"

      - name: Cache Lean toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.3
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ env.LEAN_VERSION }}

      - name: Install elan + Lean (${{ env.LEAN_VERSION }})
        run: |
          if [ ! -x "$HOME/.elan/bin/lean" ]; then
            curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              -o /tmp/elan-init.sh
            sh /tmp/elan-init.sh -y --default-toolchain "${{ env.LEAN_VERSION }}"
          fi
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          # The kernel silently falls back to "not built" if lean is missing,
          # which would make the verdict step fail for the wrong reason.
          lean --version

      - name: Recheck proofs with the Lean kernel
        run: |
          # Prints ALL PROOFS CHECK only when every def outside Base is a valid
          # proof that bend2 and the kernel both accept, with no @unsafe or
          # foreign code. Exits non-zero otherwise.
          test "$(bend PROOF.bend --verdict)" = "ALL PROOFS CHECK"
