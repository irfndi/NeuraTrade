name: Bend verdict

# The proof gate `bend PROOF.bend` runs on every Native build. This is the
# SECOND check, with the Lean kernel: it is the only one that establishes
# mathematical validity rather than checker acceptance, and it costs a Lean
# toolchain (~1.5 GB), so it runs weekly and on demand instead of per PR.
#
# Kept out of native.yml so the per-PR path filters and `needs` graph stay
# untouched; the gate text is identical (`bend PROOF.bend --verdict`).

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:
  # Editing this job is the only way to test it: `workflow_dispatch` and
  # `schedule` both resolve against the default branch, so a dispatch from a
  # feature branch 404s. A push that touches this file runs it on any branch.
  push:
    paths:
      - ".github/workflows/bend-verdict.yml"

permissions:
  contents: read

# Event name is part of the group: a push to a feature branch (the only way to
# test edits to this file) must never cancel the Monday schedule run.
concurrency:
  group: bend-verdict-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BEND_VERSION: "2.0.37"
  # The kernel BendTT builds against; must match what `bend --verdict` expects.
  LEAN_VERSION: "leanprover/lean4:v4.34.0"
  # Pinned elan installer. The elan cache key below MUST include this: the
  # cache stores ~/.elan as an opaque blob (lean present ⇒ installer body
  # skipped), so without the version in the key a bumper elan release is
  # silently invisible and the recheck runs against stale tooling.
  ELAN_VERSION: "4.2.4"
  # sha256 of elan-x86_64-unknown-linux-gnu.tar.gz in that release.
  ELAN_SHA256: "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63"

jobs:
  verdict:
    name: Lean kernel recheck (bend PROOF.bend --verdict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Bend (pinned ${{ env.BEND_VERSION }} release asset)
        # Shared composite action, same one native.yml uses, so the pinned
        # install logic exists exactly once across the repo instead of a
        # third duplicated (and drifting) copy here.
        uses: ./.github/actions/install-bend
        with:
          bend-version: ${{ env.BEND_VERSION }}

      - name: Cache Lean toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.3
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ env.ELAN_VERSION }}-${{ env.LEAN_VERSION }}

      - name: Install elan + Lean (${{ env.LEAN_VERSION }})
        run: |
          # Pinned release asset with a checksum, not `curl .../master | sh`:
          # the master branch is mutable, and piping it to a shell executes
          # whatever it holds that day. The tarball ships the elan-init binary.
          if [ ! -x "$HOME/.elan/bin/lean" ]; then
            case "$(uname -m)" in
              x86_64) ;;
              *) echo "pinned elan asset is x86_64-only (runner is $(uname -m))" >&2; exit 1 ;;
            esac
            asset="elan-x86_64-unknown-linux-gnu.tar.gz"
            curl -fsSL "https://github.com/leanprover/elan/releases/download/v${ELAN_VERSION}/${asset}" \
              -o "/tmp/${asset}"
            echo "${ELAN_SHA256}  /tmp/${asset}" | sha256sum -c -
            tar -xzf "/tmp/${asset}" -C /tmp
            /tmp/elan-init -y --default-toolchain "${{ env.LEAN_VERSION }}"
          fi
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          # The kernel silently falls back to "not built" if lean is missing,
          # which would make the verdict step fail for the wrong reason.
          lean --version

      - name: Recheck proofs with the Lean kernel
        run: |
          # Prints ALL PROOFS CHECK only when every def outside Base is a valid
          # proof that bend2 and the kernel both accept, with no @unsafe or
          # foreign code. Exits non-zero otherwise.
          #
          # Capture into a variable and echo it: `test "$(...)" = ...` swallows
          # the verdict, so a passing run used to leave no evidence in the log.
          # Exit status and verdict are separate signals: a crash must not be
          # reported as a wrong verdict, and the output is printed either way.
          if ! VERDICT="$(bend PROOF.bend --verdict)"; then
            echo "::error::bend PROOF.bend --verdict exited non-zero (stderr above)" >&2
            exit 1
          fi
          echo "verdict: $VERDICT"
          test "$VERDICT" = "ALL PROOFS CHECK"
