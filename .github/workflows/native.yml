name: Native

on:
  push:
    paths:
      - "crates/**"
      - "bend/**"
      - "scripts/zig/**"
      - ".zig-version"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "crates/**"
      - "bend/**"
      - "scripts/zig/**"
      - ".zig-version"
      - ".github/workflows/native.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BEND_VERSION: "2.0.5"

jobs:
  rust:
    name: Rust checks (fmt, clippy, examples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cd crates && cargo fmt --check

      - name: Clippy (deny warnings)
        run: cd crates && cargo clippy --all-targets -- -D warnings

      - name: Run crate checks
        run: |
          cd crates
          for p in nt-risk nt-execution nt-ledger nt-market nt-grid; do
            cargo run -q -p $p --example check
          done
          cargo run -q -p nt-grid --example paper_engine_check

  bend:
    name: Bend parity (grid + guards + search kernels)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2
        with:
          bun-version: "1.4.0"

      - name: Install Bend (pinned via install.sh + pre-seeded tarball)
        env:
          BEND_NO_TELEMETRY: "1"
        run: |
          curl -fsSL https://bend-lang.com/dl/${{ env.BEND_VERSION }}.tar.gz -o /tmp/bend.tgz
          echo "4db70e77ce1b1027f1d0e15dee025921fa794a9b415add4350ec7c64acf2775b  /tmp/bend.tgz" | sha256sum -c -
          mkdir -p "$HOME/.bend/app/${{ env.BEND_VERSION }}/ci" && tar -xzf /tmp/bend.tgz -C "$HOME/.bend/app/${{ env.BEND_VERSION }}/ci"
          ln -sfn "$HOME/.bend/app/${{ env.BEND_VERSION }}/ci" "$HOME/.bend/current"
          curl -fsSL https://bend-lang.com/install.sh | sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
          bend --version

      - name: Run grid kernel (parity checksum 663097394)
        run: |
          test "$(bend bend/grid.bend)" = "663097394"

      - name: Compile + run guards kernel (expects 2065)
        run: |
          bend bend/guards.bend -o /tmp/guards
          test "$(/tmp/guards)" = "2065"

      - name: Compile + run search kernel (expects 11)
        run: |
          bend bend/search.bend -o /tmp/search
          test "$(/tmp/search)" = "11"

      - name: Verify Bend pin
        run: test "$(bend --version)" = "bend ${{ env.BEND_VERSION }}"

  zig:
    name: Zig cross-build (box artifact)
    runs-on: ubuntu-latest
    needs: [rust, bend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Zig + cargo-zigbuild
        run: |
          pipx install cargo-zigbuild 2>/dev/null || cargo install cargo-zigbuild
          ZIG_WANT=$(cat .zig-version)
          echo "want zig $ZIG_WANT"
          curl -fsSL "https://ziglang.org/download/0.16.0/zig-linux-x86_64-0.16.0.tar.xz" -o /tmp/zig.tar.xz
          tar -xf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-linux-x86_64-0.16.0" >> "$GITHUB_PATH"

      - name: Build host binary + health probe
        run: |
          ./scripts/zig/zig-build.sh release host
          ./crates/target/release/nt-cli health

      - name: Cross-build box binary
        run: ./scripts/zig/zig-build.sh release box

      - name: Checksum + upload box artifact
        run: |
          sha256sum crates/target/x86_64-unknown-linux-gnu/release/nt-cli | tee nt-cli.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: nt-cli-linux-x64
          path: |
            crates/target/x86_64-unknown-linux-gnu/release/nt-cli
            nt-cli.sha256
          retention-days: 30
