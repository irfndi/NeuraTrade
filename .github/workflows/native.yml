name: Native

on:
  push:
    paths:
      - "crates/**"
      - "bend/**"
      - "scripts/zig/**"
      - ".zig-version"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "crates/**"
      - "bend/**"
      - "scripts/zig/**"
      - ".zig-version"
      - ".github/workflows/native.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BEND_VERSION: "2.0.21"

jobs:
  rust:
    name: Rust checks (fmt, clippy, examples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cd crates && cargo fmt --check

      - name: Clippy (deny warnings)
        run: cd crates && cargo clippy --all-targets -- -D warnings

      - name: Run crate checks
        run: |
          cd crates
          for p in nt-risk nt-execution nt-ledger nt-market nt-grid nt-ladder; do
            cargo run -q -p $p --example check
          done
          cargo run -q -p nt-grid --example paper_engine_check
          cargo run -q -p nt-grid --example sleeves_check
          cargo run -q -p nt-grid --example pump_catch
          cargo run -q -p nt-grid --example rung_parity_probe
          cargo run -q -p nt-grid --example engine_vs_ts_probe
          cargo run -q -p nt-grid --example day_start_check

      - name: Run unit tests
        run: cd crates && cargo test -q --workspace

      # Gate 4 GRID half: Rust-only. The TS paper engine's output is FROZEN
      # as committed CSV (nt-grid/examples/grid_parity_fixture.*.csv, written
      # once by services/neuratrade-cli-ts/grid_parity_fixture.ts). No bun in
      # CI — TS leaves this gate entirely when it sunsets.
      # Ladder soak is NOT covered (P5 Step 3 scope).
      - name: Grid parity vs frozen TS fixture
        run: cd crates && cargo run -q -p nt-grid --example grid_parity

  bend:
    name: Bend parity (grid + guards + search kernels)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2
        with:
          bun-version: "1.4.2"

      - name: Install Bend (pinned ${{ env.BEND_VERSION }} from an immutable release asset)
        env:
          BEND_NO_TELEMETRY: "1"
        run: |
          # Download the PINNED version's release asset, NOT the mutable
          # install.sh. Upstream ships new Bend releases roughly daily
          # (2.0.20 -> 2.0.21 -> 2.0.22 -> 2.0.23 within two days), so piping
          # install.sh lets the installed version drift off the pin and the
          # version assertion fails on a release nobody asked for. The asset
          # URL is immutable per version, which also removes the `curl | sh`
          # supply-chain exposure.
          set -o pipefail
          VER="${{ env.BEND_VERSION }}"
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) asset="bend-${VER}-linux-x64.tar.gz" ;;
            Linux-arm64|Linux-aarch64) asset="bend-${VER}-linux-arm64.tar.gz" ;;
            Darwin-arm64) asset="bend-${VER}-darwin-arm64.tar.gz" ;;
            Darwin-x86_64) asset="bend-${VER}-darwin-x64.tar.gz" ;;
            *) echo "unsupported runner arch $(uname -s)-$(uname -m)" >&2; exit 1 ;;
          esac
          url="https://github.com/bendlang/bend/releases/download/v${VER}/${asset}"
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 "$url" -o "/tmp/${asset}"; then break; fi
            echo "bend download attempt $attempt failed: $url" >&2
            [ "$attempt" = 3 ] && exit 1
            sleep $((attempt * 10))
          done
          mkdir -p "$HOME/.bend"
          tar -xzf "/tmp/${asset}" -C "$HOME/.bend"
          echo "$HOME/.bend/bend/bin" >> "$GITHUB_PATH"
          # GITHUB_PATH applies to NEXT steps only: export in-step so the
          # pin check below resolves bend in THIS step.
          export PATH="$HOME/.bend/bend/bin:$PATH"
          test "$(bend version)" = "bend ${VER}"
      - name: Run grid kernel (parity checksum 663097394)
        run: |
          test "$(bend bend/grid.bend)" = "663097394"

      - name: Compile + run guards kernel (expects 2065)
        run: |
          bend bend/guards.bend -o /tmp/guards
          test "$(/tmp/guards)" = "2065"

      - name: Compile + run search kernel (expects 11)
        run: |
          bend bend/search.bend -o /tmp/search
          test "$(/tmp/search)" = "11"

      - name: Compile + run sleeves kernel (expects 13)
        run: |
          bend bend/sleeves.bend -o /tmp/sleeves
          test "$(/tmp/sleeves)" = "13"

      - name: Verify Bend pin
        run: test "$(bend version)" = "bend ${{ env.BEND_VERSION }}"

  zig:
    name: Zig cross-build (box artifact)
    runs-on: ubuntu-latest
    needs: [rust, bend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Bend (pinned ${{ env.BEND_VERSION }} from an immutable release asset)
        env:
          BEND_NO_TELEMETRY: "1"
        run: |
          # Same pinned-asset install as the bend job: upstream ships daily
          # releases, so a mutable install.sh drifts off the pin. See that
          # step's comment for the full rationale.
          set -o pipefail
          VER="${{ env.BEND_VERSION }}"
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) asset="bend-${VER}-linux-x64.tar.gz" ;;
            Linux-arm64|Linux-aarch64) asset="bend-${VER}-linux-arm64.tar.gz" ;;
            Darwin-arm64) asset="bend-${VER}-darwin-arm64.tar.gz" ;;
            Darwin-x86_64) asset="bend-${VER}-darwin-x64.tar.gz" ;;
            *) echo "unsupported runner arch $(uname -s)-$(uname -m)" >&2; exit 1 ;;
          esac
          url="https://github.com/bendlang/bend/releases/download/v${VER}/${asset}"
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 "$url" -o "/tmp/${asset}"; then break; fi
            echo "bend download attempt $attempt failed: $url" >&2
            [ "$attempt" = 3 ] && exit 1
            sleep $((attempt * 10))
          done
          mkdir -p "$HOME/.bend"
          tar -xzf "/tmp/${asset}" -C "$HOME/.bend"
          echo "$HOME/.bend/bend/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.bend/bend/bin:$PATH"
          test "$(bend version)" = "bend ${VER}"

      - name: Install Zig + cargo-zigbuild
        run: |
          pipx install cargo-zigbuild 2>/dev/null || cargo install cargo-zigbuild
          ZIG_WANT=$(cat .zig-version)
          echo "want zig $ZIG_WANT"
          # Canonical name: zig-x86_64-linux-<ver> (zig-linux-x86_64 404s).
          curl -fsSL "https://ziglang.org/download/${ZIG_WANT}/zig-x86_64-linux-${ZIG_WANT}.tar.xz" -o /tmp/zig.tar.xz
          tar -xf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-${ZIG_WANT}" >> "$GITHUB_PATH"
      - name: Build host binary + health probe
        run: |
          ./scripts/zig/zig-build.sh release host
          ./crates/target/release/nt-cli health

      - name: Cross-build box binary
        run: ./scripts/zig/zig-build.sh release box

      - name: Checksum + upload box artifacts
        run: |
          sha256sum crates/target/x86_64-unknown-linux-gnu/release/nt-cli crates/target/x86_64-unknown-linux-gnu/release/nt-search | tee nt-cli.sha256
          test "$(crates/target/x86_64-unknown-linux-gnu/release/nt-search)" = "11"

      - uses: actions/upload-artifact@v4
        with:
          name: nt-cli-linux-x64
          path: |
            crates/target/x86_64-unknown-linux-gnu/release/nt-cli
            crates/target/x86_64-unknown-linux-gnu/release/nt-search
            nt-cli.sha256
          retention-days: 30
