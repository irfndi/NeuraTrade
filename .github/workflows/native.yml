name: Native

on:
  push:
    paths:
      - "crates/**"
      - "bend/**"
      # The repo-root law/proof pair is the gate itself; without these a proof
      # change would never trigger the job that checks it.
      - "LAWS.bend"
      - "PROOF.bend"
      - "scripts/zig/**"
      - ".zig-version"
      - ".github/workflows/native.yml"
  # Fork PRs run repo scripts from the PR head. That is a deliberate choice:
  # `pull_request` (never `pull_request_target`) means no secrets reach fork
  # code and the default token is read-only, but every step below must be
  # treated as executing untrusted code.
  pull_request:
    paths:
      - "crates/**"
      - "bend/**"
      - "LAWS.bend"
      - "PROOF.bend"
      - "scripts/zig/**"
      - ".zig-version"
      - ".github/workflows/native.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Event names must not collapse into one group: a push (bump the pin) on the
# same ref as an in-flight PR run would otherwise cancel it.
concurrency:
  group: native-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 2.0.37: the version the chop-gate laws and the four kernel checksums were
  # verified against (grid 663097394 / guards 2065 / search 11 / sleeves 13 all
  # reproduce identically on 2.0.37, so the bump is a pin refresh, not a
  # behaviour change).
  BEND_VERSION: "2.0.37"

jobs:
  rust:
    name: Rust checks (fmt, clippy, examples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Rust toolchain (pinned 1.99.1)
        # `@stable` silently rolls daily, making fmt/clippy results
        # nondeterministic. Pin the action to a master-history SHA (required
        # by upstream for SHA pins) + the exact toolchain verified locally.
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cd crates && cargo fmt --check

      - name: Clippy (deny warnings)
        run: cd crates && cargo clippy --all-targets -- -D warnings

      - name: Run crate checks
        run: |
          cd crates
          for p in nt-risk nt-execution nt-ledger nt-market nt-grid nt-ladder; do
            cargo run -q -p $p --example check
          done
          cargo run -q -p nt-grid --example paper_engine_check
          cargo run -q -p nt-grid --example sleeves_check
          cargo run -q -p nt-grid --example pump_catch
          cargo run -q -p nt-grid --example rung_parity_probe
          cargo run -q -p nt-grid --example engine_vs_ts_probe
          cargo run -q -p nt-grid --example day_start_check

      - name: Run unit tests
        run: cd crates && cargo test -q --workspace

      # Gate 4 GRID half: Rust-only. The TS paper engine's output is FROZEN
      # as committed CSV (nt-grid/examples/grid_parity_fixture.*.csv, written
      # once by services/neuratrade-cli-ts/grid_parity_fixture.ts). No bun in
      # CI — TS leaves this gate entirely when it sunsets.
      # Ladder soak is NOT covered (P5 Step 3 scope).
      - name: Grid parity vs frozen TS fixture
        run: cd crates && cargo run -q -p nt-grid --example grid_parity

  bend:
    name: Bend parity (grid + guards + search kernels)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2
        with:
          bun-version: "1.4.2"

      - name: Install Bend (pinned ${{ env.BEND_VERSION }} from an immutable release asset)
        # Shared composite action: performs the pinned-asset install + version
        # assertion that was formerly duplicated (verbatim, and drifting) in
        # each job. .github/workflows is intentionally untouched so any future
        # bend install change happens in exactly one place.
        uses: ./.github/actions/install-bend
        with:
          bend-version: ${{ env.BEND_VERSION }}
      - name: Prove LAWS.bend (`bend PROOF.bend` is the gate)
        run: |
          # Exits non-zero and prints SOME PROOFS FAIL while any law is open or
          # false; `main` printing "laws hold" is the passing marker. This is
          # the one step that fails on a Bend regression — the kernels below
          # would still print their sums with a broken proof.
          #
          # NOT run here: `--verdict`, which rechecks with a Lean kernel and
          # needs Lean v4.34.0 (~1.5 GB toolchain). It is the local/periodic
          # check: `bend PROOF.bend --verdict` prints ALL PROOFS CHECK only when
          # the proof is mathematically valid.
          out="$(bend PROOF.bend)"
          if [ "$out" != "laws hold" ]; then
            echo "bend PROOF.bend rejected: got '$out', want 'laws hold'" >&2
            exit 1
          fi

      - name: Run grid kernel (parity checksum 663097394)
        run: |
          out="$(bend bend/grid.bend)"
          if [ "$out" != "663097394" ]; then
            echo "grid kernel mismatch: got '$out', want '663097394'" >&2
            exit 1
          fi

      - name: Compile + run guards kernel (expects 2065)
        run: |
          bend bend/guards.bend -o /tmp/guards
          out="$(/tmp/guards)"
          if [ "$out" != "2065" ]; then
            echo "guards kernel mismatch: got '$out', want '2065'" >&2
            exit 1
          fi

      - name: Compile + run search kernel (expects 11)
        run: |
          bend bend/search.bend -o /tmp/search
          out="$(/tmp/search)"
          if [ "$out" != "11" ]; then
            echo "search kernel mismatch: got '$out', want '11'" >&2
            exit 1
          fi

      - name: Compile + run sleeves kernel (expects 13)
        run: |
          bend bend/sleeves.bend -o /tmp/sleeves
          out="$(/tmp/sleeves)"
          if [ "$out" != "13" ]; then
            echo "sleeves kernel mismatch: got '$out', want '13'" >&2
            exit 1
          fi

      - name: Verify Bend pin
        run: |
          got="$(bend version)"
          if [ "$got" != "bend ${{ env.BEND_VERSION }}" ]; then
            echo "bend version mismatch: got '$got', want 'bend ${{ env.BEND_VERSION }}'" >&2
            exit 1
          fi

  zig:
    name: Zig cross-build (box artifact)
    runs-on: ubuntu-latest
    needs: [rust, bend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Rust toolchain (pinned 1.99.1)
        # Same pin as the rust job; see that step's comment for the rationale.
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Bend (pinned ${{ env.BEND_VERSION }} from an immutable release asset)
        # Same composite action as the bend job (single install script shared
        # across all jobs that need bend, no per-job copies to keep in sync).
        uses: ./.github/actions/install-bend
        with:
          bend-version: ${{ env.BEND_VERSION }}

      - name: Install Zig + cargo-zigbuild
        run: |
          set -euo pipefail
          pipx install cargo-zigbuild 2>/dev/null || cargo install cargo-zigbuild
          ZIG_WANT="$(cat .zig-version)"
          # .zig-version comes from the PR; validate it before it lands in a
          # download URL, where anything but a bare x.y.z turns into a
          # malformed (or attacker-shaped) fetch.
          if ! echo "$ZIG_WANT" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo ".zig-version must contain a bare x.y.z version; got '$ZIG_WANT'" >&2
            exit 1
          fi
          echo "want zig $ZIG_WANT"
          # Canonical name: zig-x86_64-linux-<ver> (zig-linux-x86_64 404s).
          curl -fsSL "https://ziglang.org/download/${ZIG_WANT}/zig-x86_64-linux-${ZIG_WANT}.tar.xz" -o /tmp/zig.tar.xz
          tar -xf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-${ZIG_WANT}" >> "$GITHUB_PATH"
      - name: Build host binary + health probe
        run: |
          ./scripts/zig/zig-build.sh release host
          ./crates/target/release/nt-cli health

      - name: Cross-build box binary
        run: ./scripts/zig/zig-build.sh release box

      - name: Checksum + upload box artifacts
        run: |
          sha256sum crates/target/x86_64-unknown-linux-gnu/release/nt-cli crates/target/x86_64-unknown-linux-gnu/release/nt-search | tee nt-cli.sha256
          test "$(crates/target/x86_64-unknown-linux-gnu/release/nt-search)" = "11"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nt-cli-linux-x64
          path: |
            crates/target/x86_64-unknown-linux-gnu/release/nt-cli
            crates/target/x86_64-unknown-linux-gnu/release/nt-search
            nt-cli.sha256
          retention-days: 30
