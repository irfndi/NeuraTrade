[install]
# Bun 1.4 isolated installs share package materializations through the global
# virtual store, avoiding duplicate dependency trees across NeuraTrade services.
linker = "isolated"
globalStore = true

[test]
preload = ["./test-setup.ts"]

coverageThreshold = { lines = 0.8, functions = 0.8, statements = 0.8, branches = 0.7 }
