[project]
name = "neuratrade-timesfm"
version = "0.1.0"
description = "Research-only TimesFM 3 forecasting sidecar for NeuraTrade"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26.4,<3",
  "timesfm[torch]==3.0.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<0.13",
]

[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
indent-width = 2

[tool.setuptools.packages.find]
where = ["src"]
